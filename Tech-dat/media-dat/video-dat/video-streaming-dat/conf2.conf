
max_connections      1000;
daemon              on;

rtmp {
    listen              1935;
}

srt_server {
    enabled             on;
    listen              10080;
}

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

vhost __defaultVhost__ {
    hls {
        enabled         on;
    }
}