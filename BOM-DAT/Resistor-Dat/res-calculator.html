<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>并联电阻组合查找器（毫欧）</title>
  <style>
    :root{
      --bg:#f7f9fb;
      --card:#ffffff;
      --accent:#0b6efd;
      --muted:#6b7280;
      --success:#10b981;
    }
    html,body{height:100%}
    body{
      margin:0;
      font-family:system-ui,-apple-system,"Segoe UI","Helvetica Neue",Roboto,"Noto Sans",Arial;
      background:linear-gradient(180deg,#eef6ff 0%,var(--bg) 100%);
      color:#0f1724;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      padding:24px;
      box-sizing:border-box;
    }
    .container{
      max-width:980px;
      margin:0 auto;
    }
    .card{
      background:var(--card);
      border-radius:12px;
      padding:18px;
      box-shadow:0 6px 20px rgba(15,23,36,0.08);
    }
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    h1{font-size:18px;margin:0}
    p.lead{margin:6px 0 0;color:var(--muted);font-size:13px}
    form{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      align-items:center;
      margin:14px 0 6px;
    }
    label{font-size:13px;color:var(--muted)}
    input[type="number"], select {
      padding:10px 12px;
      border-radius:8px;
      border:1px solid #e6e9ee;
      font-size:14px;
      min-width:140px;
    }
    button{
      background:var(--accent);
      color:white;
      border:0;
      padding:10px 14px;
      border-radius:8px;
      font-weight:600;
      cursor:pointer;
    }
    button.secondary{
      background:transparent;
      color:var(--accent);
      border:1px solid #d1e4ff;
    }
    .results{margin-top:14px}
    table{width:100%;border-collapse:collapse}
    th,td{padding:10px 8px;text-align:left;border-bottom:1px solid #f1f5f9;font-size:13px}
    th{color:var(--muted);font-weight:600}
    .chip{
      display:inline-block;padding:6px 8px;border-radius:999px;background:#f1f5ff;color:var(--accent);font-weight:600;font-size:13px;margin-right:6px
    }
    .muted{color:var(--muted)}
    .small{font-size:12px;color:var(--muted)}
    @media (max-width:640px){
      form{flex-direction:column;align-items:stretch}
      input[type="number"], select{width:100%}
      button{width:100%}
      header{flex-direction:column;align-items:flex-start}
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card" role="main" aria-labelledby="title">
      <header>
        <div>
          <h1 id="title">并联电阻组合查找器（毫欧）</h1>
          <p class="lead">输入目标阻值，查找最多 1~3 个电阻并联后最接近的组合。</p>
        </div>
        <div class="small">可用电阻表：3, 3.5, 4, 5, 6, 7, 8, 10, 12, 15, 16, 18, 20, 25, 30, 33, 35, 40, 50, 60, 64, 65, 70, 75, 80, 100, 120, 150, 180, 200, 220, 250, 270, 330 (mΩ)</div>
      </header>

      <form id="finderForm" onsubmit="return false;" aria-label="查找并联组合">
        <div>
          <label for="target">目标阻值 (mΩ)</label><br/>
          <input id="target" type="number" step="any" min="0.0001" value="11" required />
        </div>

        <div>
          <label for="maxCount">最大电阻数</label><br/>
          <select id="maxCount">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3" selected>3</option>
            <option value="4">4</option>
          </select>
        </div>

        <div>
          <label for="topN">显示前几名</label><br/>
          <input id="topN" type="number" min="1" max="200" value="10" />
        </div>

        <div style="display:flex;gap:8px;align-items:center">
          <button id="runBtn" type="button">查找</button>
          <button id="resetBtn" class="secondary" type="button">重置</button>
        </div>
      </form>

      <div class="results" id="results" aria-live="polite"></div>
    </div>
  </div>

  <script>
    // 可用电阻（毫欧）
    const resistors = [3, 3.5, 4, 5, 6, 7, 8, 10, 12, 15, 16, 18, 20,
                       25, 30, 33, 35, 40, 50, 60, 64, 65, 70, 75, 80,
                       100, 120, 150, 180, 200, 220, 250, 270, 330];

    // 计算并联等效阻值
    function parallelResistance(combo) {
      let sum = 0;
      for (const r of combo) sum += 1 / r;
      return 1 / sum;
    }

    // 生成 combinations with replacement (重复组合，且组合内部不考虑顺序)
    function combinationsWithReplacement(arr, k) {
      // 返回所有长度为 k 的 nondecreasing 索引组合
      const n = arr.length;
      const results = [];
      const idx = Array.from({length: k}, () => 0);

      function helper(pos, start) {
        if (pos === k) {
          results.push(idx.map(i => arr[i]));
          return;
        }
        for (let i = start; i < n; i++) {
          idx[pos] = i;
          helper(pos + 1, i);
        }
      }

      if (k === 0) return [[]];
      helper(0, 0);
      return results;
    }

    // 查找最佳组合（按误差排序）
    function findBestCombinations(target, maxResistors = 3, topN = 10) {
      const best = [];

      for (let r = 1; r <= maxResistors; r++) {
        const combos = combinationsWithReplacement(resistors, r);
        for (const combo of combos) {
          const req = parallelResistance(combo);
          const diff = Math.abs(req - target);
          best.push({diff, req, combo});
        }
      }

      best.sort((a,b) => a.diff - b.diff || a.req - b.req);
      return best.slice(0, topN);
    }

    // 格式化数字（尽量保持与 Python 示例类似的显示精度）
    function fmt(x) {
      // 保留 6 位小数，但去掉尾部多余的 0
      return Number.parseFloat(x).toFixed(6).replace(/\.?0+$/, '');
    }

    // 渲染结果
    function renderResults(list, target) {
      const container = document.getElementById('results');
      if (!list || list.length === 0) {
        container.innerHTML = '<div class="card small">未找到结果。</div>';
        return;
      }

      let html = '';
      html += '<div style="margin-bottom:8px"><span class="chip">目标 ' + target + ' mΩ</span><span class="small muted">并联等效</span></div>';
      html += '<div class="card" style="padding:10px">';
      html += '<table role="table" aria-label="结果表格">';
      html += '<thead><tr><th>#</th><th>组合 (mΩ)</th><th>并联等效 (mΩ)</th><th>误差 (mΩ)</th></tr></thead><tbody>';

      list.forEach((it, idx) => {
        const comboStr = it.combo.join(' , ');
        html += `<tr>
          <td style="width:36px">${idx+1}</td>
          <td>${comboStr}</td>
          <td>${fmt(it.req)}</td>
          <td class="muted">${fmt(it.diff)}</td>
        </tr>`;
      });

      html += '</tbody></table></div>';
      container.innerHTML = html;
    }

    // 按钮事件
    document.getElementById('runBtn').addEventListener('click', () => {
      const target = parseFloat(document.getElementById('target').value);
      const maxCount = parseInt(document.getElementById('maxCount').value, 10);
      let topN = parseInt(document.getElementById('topN').value, 10);
      if (!isFinite(target) || target <= 0) {
        alert('请输入大于 0 的目标阻值（毫欧）');
        return;
      }
      if (isNaN(topN) || topN < 1) topN = 10;

      // 为了性能，如果组合数过多，提示或限制
      // 组合总数 = sum_{r=1..maxCount} C(n+r-1, r)
      const n = resistors.length;
      function comb(n,k){
        k = Math.min(k, n-k);
        let num = 1, den = 1;
        for (let i=1;i<=k;i++){ num *= (n - k + i); den *= i; }
        return Math.round(num/den);
      }
      let total = 0;
      for (let r=1;r<=maxCount;r++){
        // C(n+r-1, r)
        total += comb(n + r - 1, r);
      }
      if (total > 200000 && !confirm(`将会搜索约 ${total.toLocaleString()} 个组合，可能需要较长时间。继续？`)) {
        return;
      }

      // 运行查找（在主线程，可能会卡 UI；对于非常大搜索可改为 web worker）
      const results = findBestCombinations(target, maxCount, topN);
      renderResults(results, target);
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      document.getElementById('target').value = '11';
      document.getElementById('maxCount').value = '3';
      document.getElementById('topN').value = '10';
      document.getElementById('results').innerHTML = '';
    });

    // 初始化展示一次默认结果
    window.addEventListener('load', () => {
      document.getElementById('runBtn').click();
    });
  </script>
</body>
</html>
